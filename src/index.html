<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FFmpeg Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>FFmpeg Desktop</h1>
    </header>
    
    <nav class="sidebar">
      <button id="btn-trim" class="nav-button active">Trim Audio/Video</button>
      <button id="btn-convert" class="nav-button">Convert Format</button>
      <button id="btn-extract" class="nav-button">Extract Audio</button>
      <button id="btn-merge" class="nav-button">Merge Media</button>
      <button id="btn-presets" class="nav-button">Presets</button>
      <button id="btn-history" class="nav-button">History</button>
    </nav>
    
    <main class="content">
      <section id="section-trim" class="section active">
        <h2>Trim Audio/Video</h2>
        
        <div class="input-group">
          <label for="directory-selection">Working Directory:</label>
          <div class="directory-selector">
            <input type="text" id="directory-path" placeholder="Select a directory" readonly>
            <button id="select-directory">Browse</button>
          </div>
        </div>
        
        <div class="input-group">
          <label>File Selection:</label>
          <div class="file-selection-options">
            <button id="select-files" class="option-button">Select Individual Files</button>
            <button id="process-directory" class="option-button">Process All Files in Directory</button>
          </div>
          <div id="file-filters" class="filter-options">
            <label><input type="checkbox" id="filter-m4a" checked> .m4a</label>
            <label><input type="checkbox" id="filter-mp3"> .mp3</label>
            <label><input type="checkbox" id="filter-wav"> .wav</label>
            <label><input type="checkbox" id="filter-aac"> .aac</label>
          </div>
          <div id="selected-files" class="file-list"></div>
        </div>
        
        <div class="input-group">
          <label>Time Format:</label>
          <select id="time-format">
            <option value="seconds">Seconds</option>
            <option value="timestamp" selected>Timestamp (HH:MM:SS)</option>
          </select>
        </div>
        
        <div class="input-group">
          <label for="trim-start">Start Time:</label>
          <input type="text" id="trim-start" placeholder="00:00:00">
        </div>
        
        <div class="input-group">
          <label for="trim-duration">Duration (or End Time):</label>
          <input type="text" id="trim-duration" placeholder="00:30:00">
          <select id="duration-type">
            <option value="duration" selected>Duration</option>
            <option value="end-time">End Time</option>
          </select>
        </div>
        
        <div class="input-group">
          <label>Output Format:</label>
          <select id="output-format">
            <option value="same">Same as input</option>
            <option value="mp3">MP3</option>
            <option value="m4a">M4A</option>
            <option value="wav">WAV</option>
          </select>
        </div>
        
        <div class="input-group">
          <label for="output-suffix">Output Filename Suffix:</label>
          <input type="text" id="output-suffix" value="_trimmed">
        </div>

        <div class="input-group">
          <label>Output Directory:</label>
          <div class="output-directory-options">
            <label class="radio-option">
              <input type="radio" name="output-directory-mode" id="output-same" value="same" checked>
              Use original file directory
            </label>
            <label class="radio-option">
              <input type="radio" name="output-directory-mode" id="output-custom" value="custom">
              Use custom directory
            </label>
          </div>
          <div class="directory-selector custom-output-selector hidden" id="custom-output-selector">
            <input type="text" id="custom-output-path" placeholder="Select output directory" readonly>
            <button id="select-output-directory">Browse</button>
          </div>
          <small class="helper-text">If no custom directory is selected, files will be stored alongside their sources.</small>
        </div>
        
        <button id="start-trim" class="primary-button">Start Trimming</button>
        
        <div id="progress-container" class="hidden">
          <progress id="progress-bar" max="100" value="0"></progress>
          <div id="progress-text">0%</div>
        </div>
      </section>
      
      <section id="section-convert" class="section">
        <h2>Convert Format</h2>

        <div class="input-group">
          <label for="convert-directory-path">Working Directory (optional):</label>
          <div class="directory-selector">
            <input type="text" id="convert-directory-path" placeholder="Select a directory" readonly>
            <button id="convert-select-directory">Browse</button>
          </div>
          <small class="helper-text">Choose a directory to quickly load all supported audio files.</small>
        </div>

        <div class="input-group">
          <label>File Selection:</label>
          <div class="file-selection-options">
            <button id="convert-select-files" class="option-button">Select Files</button>
            <button id="convert-process-directory" class="option-button">Load Directory Files</button>
          </div>
          <div id="convert-file-filters" class="filter-options">
            <label><input type="checkbox" id="convert-filter-mp3" checked> .mp3</label>
            <label><input type="checkbox" id="convert-filter-m4a" checked> .m4a</label>
            <label><input type="checkbox" id="convert-filter-wav" checked> .wav</label>
            <label><input type="checkbox" id="convert-filter-aac" checked> .aac</label>
          </div>
          <div id="convert-selected-files" class="file-list"></div>
        </div>

        <div class="input-group">
          <label for="convert-target-format">Target Format:</label>
          <select id="convert-target-format">
            <option value="mp3">MP3 (.mp3)</option>
            <option value="m4a">M4A (.m4a)</option>
            <option value="wav">WAV (.wav)</option>
            <option value="aac">AAC (.aac)</option>
          </select>
        </div>

        <div class="input-group">
          <label for="convert-output-suffix">Output Filename Suffix:</label>
          <input type="text" id="convert-output-suffix" value="_converted">
        </div>

        <div class="input-group">
          <label>Output Directory:</label>
          <div class="output-directory-options">
            <label class="radio-option">
              <input type="radio" name="convert-output-directory-mode" id="convert-output-same" value="same" checked>
              Use original file directory
            </label>
            <label class="radio-option">
              <input type="radio" name="convert-output-directory-mode" id="convert-output-custom" value="custom">
              Use custom directory
            </label>
          </div>
          <div class="directory-selector custom-output-selector hidden" id="convert-custom-output-selector">
            <input type="text" id="convert-custom-output-path" placeholder="Select output directory" readonly>
            <button id="convert-select-output-directory">Browse</button>
          </div>
          <small class="helper-text">Converted files can reuse the original directory or a custom destination.</small>
        </div>

        <button id="start-convert" class="primary-button">Start Conversion</button>

        <div id="convert-progress-container" class="hidden">
          <progress id="convert-progress-bar" max="100" value="0"></progress>
          <div id="convert-progress-text">0%</div>
        </div>
      </section>

      <!-- Other sections for different operations would go here -->
    </main>
  </div>
  
  <script src="renderer.js"></script>
</body>
</html>
